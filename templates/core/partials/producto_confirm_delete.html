<div class="modal modal-blur" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
      <div class="modal-content">
        
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        
        <div class="modal-status bg-danger"></div>
        
        <div class="modal-body text-center py-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon mb-2 text-danger icon-lg" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7l16 0" /><path d="M10 11l0 6" /><path d="M14 11l0 6" /><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" /><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" /></svg>
          
          <h3>¿Estás seguro?</h3>
          <div class="text-secondary">
            ¿Realmente deseas eliminar el producto <strong>{{ producto.nombre }}</strong>? Esta acción no se puede deshacer.
          </div>
          
          {% if error %}
              <div class="alert alert-danger mt-3" role="alert">{{ error }}</div>
          {% endif %}
        </div>
        
        <div class="modal-footer">
          <div class="w-100">
            <div class="row">
              <div class="col">
                <a href="#" class="btn w-100" data-bs-dismiss="modal">Cancelar</a>
              </div>
              <div class="col">
                <form hx-post="{% url 'eliminar_producto' producto.pk %}" hx-target="#modal-container">
                  {% csrf_token %}
                  <button type="submit" class="btn btn-danger w-100">Eliminar</button>
                </form>
              </div>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </div>
