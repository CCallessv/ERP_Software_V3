<div class="modal modal-blur" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Generar Nuevo Documento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <form hx-post="{% url 'crear_venta_borrador' %}" hx-target="#modal-container">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        {% if error %}
                            <div class="alert alert-danger mb-3">
                                <strong>⚠️ Error:</strong> {{ error }}
                            </div>
                        {% endif %}
                        <div class="mb-3">
                            <label class="form-label">Selecciona el Cliente *</label>
                            <select name="cliente" class="form-select" required>
                                <option value="">-- Selecciona un cliente --</option>
                                {% for cliente in clientes %}
                                    <option value="{{ cliente.id }}">{{ cliente.nombres }} {{ cliente.apellidos }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label required">Tipo de Comprobante</label>
                        <select name="tipo_documento" class="form-select" required>
                            <option value="" disabled {% if not tipo_documento_seleccionado %}selected{% endif %}>-- Elige el documento --</option>
                            <option value="FCF" {% if tipo_documento_seleccionado == 'FCF' %}selected{% endif %}>Factura de Consumidor Final (FCF)</option>
                            <option value="CCF" {% if tipo_documento_seleccionado == 'CCF' %}selected{% endif %}>Comprobante de Crédito Fiscal (CCF)</option>
                        </select>
                        <small class="form-hint">Asegúrate de que el cliente tenga su NIT/NRC registrado si eliges CCF.</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-danger">Condición de Pago *</label>
                        <select name="condicion_pago" id="id_condicion_pago" class="form-select" required>
                            <option value="contado" {% if condicion_pago_seleccionada == 'contado' %}selected{% endif %}>Contado (Pago Inmediato)</option>
                            <option value="credito" {% if condicion_pago_seleccionada == 'credito' %}selected{% endif %}>Crédito (Cuentas por Cobrar)</option>
                        </select>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn me-auto" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Crear Documento</button>
                </div>
            </form>
        </div>
    </div>
</div>
